<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <script>
      ;(() => {
        let language = null
        let theme = null
        try {
          language = localStorage.getItem('syrian-menu-language')
          theme = localStorage.getItem('syrian-menu-theme')
        } catch {
          /* Restricted storage must not block the initial theme. */
        }
        const root = document.documentElement
        const resolvedTheme =
          theme === 'light' || theme === 'dark'
            ? theme
            : matchMedia('(prefers-color-scheme: dark)').matches
              ? 'dark'
              : 'light'
        root.dataset.theme = resolvedTheme
        root.style.colorScheme = resolvedTheme
        root.lang = language === 'ar' ? 'ar' : 'en'
        root.dir = root.lang === 'ar' ? 'rtl' : 'ltr'
      })()
    </script>
    <style>
      html {
        background: #f7f4ed;
      }
      html[data-theme='dark'] {
        background: #13241d;
      }
    </style>
    <link rel="icon" type="image/png" href="/brand/symbol.png" />
    <link
      rel="preload"
      href="/fonts/cairo-arabic-wght-normal.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/fonts/inter-latin-wght-normal.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/fonts/lora-latin-wght-normal.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <meta name="theme-color" content="#163f30" />
    <meta
      name="description"
      content="Your food tells a story. Give it a menu that does, too. Discover SYRIAN MENU: beautiful, bilingual digital menus made for your restaurant."
    />
    <meta property="og:title" content="SYRIAN MENU — A fresh way to share your good taste" />
    <meta
      property="og:description"
      content="Beautiful digital menus. Real hospitality. Try the interactive restaurant menu experience."
    />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/images/syrian-table.webp" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SYRIAN MENU — A fresh way to share your good taste</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
